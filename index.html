<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b1f4b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="سلفە">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>دابەشکرنا سلفێ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* VOICE: calm money tool, clear numbers first
   IDEA: a cashier's ledger — total at top, two drawers: departments and ئیفاد
   PICTURE: the live remaining balance, large, with a fill bar
   COLOUR and TYPE: oxford blue band, white panels, magenta for the remaining; Noto Sans Arabic
   LAYOUT: one column; balance band with two tab tiles, then ledger rows */
:root{color-scheme:light dark;--bg:light-dark(#eef1f7,#070f26);--panel:light-dark(#fff,#0f1a3a);--ink:light-dark(#0b1f4b,#e8ecf7);--mute:light-dark(#5a6a8c,#9aa8c9);--line:light-dark(#dde3ef,#1f2c52);--band:#0b1f4b;--acc:#e0115f;--ok:light-dark(#0a7d4f,#3fd59a);--okbg:light-dark(#e3f6ee,#0c2a20)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Noto Sans Arabic",Tahoma,sans-serif;overflow-x:clip}
.band{background:var(--band);color:#fff;padding:22px max(4vw,14px) 26px}
.wrap{max-width:760px;margin:0 auto}
.hd{display:flex;align-items:center;gap:12px;margin-bottom:14px}
h1{flex:1;font-size:22px;margin:0;font-weight:800;line-height:1.3}
.logo{width:64px;height:auto;background:#fff;border-radius:12px;padding:3px;flex:none}
.gear{flex:none;width:48px;height:48px;padding:0;display:grid;place-items:center;background:#132a62;color:#fff;border:1px solid #2b4380;border-radius:14px}
.gear svg{width:24px;height:24px}
.mp{display:grid;grid-template-columns:44px minmax(0,1fr) 100px 44px;gap:6px;margin-bottom:12px}
.mp select,.mp button{font:700 16px "Noto Sans Arabic",sans-serif;min-height:46px;border-radius:12px;border:1px solid #2b4380;background:#132a62;color:#fff;padding:0 10px}
.mp button{padding:0;font-size:24px;line-height:1}
.mp select:focus{outline:3px solid var(--acc)}
.empty small{display:block;margin-top:8px;font-size:13px}
.tot label{display:block;font-size:14px;opacity:.8;margin-bottom:4px}
.tot input{width:100%;font:800 22px "Noto Sans Arabic",sans-serif;padding:10px 14px;border-radius:12px;border:2px solid #2b4380;background:#132a62;color:#fff;direction:ltr;text-align:right}
.tot input:focus{outline:3px solid var(--acc);outline-offset:1px}
.remrow{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.sv{flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:84px;min-height:72px;padding:6px 10px;border-radius:14px;background:var(--ok);border:0;color:#fff;font-size:13px;position:relative}
.sv svg{width:24px;height:24px}
.sv.dirty{background:var(--acc)}
.sv.dirty::after{content:"";position:absolute;top:6px;left:6px;width:10px;height:10px;border-radius:50%;background:#fff}
.big{margin-top:18px;font-size:14px;opacity:.85}
.rem{font-size:clamp(34px,10vw,52px);font-weight:800;line-height:1.1;color:#ff4d8d;direction:ltr;text-align:right;white-space:nowrap}
.rem.neg{color:#ffb300}
.bar{height:12px;background:#1d3570;border-radius:9px;overflow:hidden;margin:12px 0 14px}
.bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .35s}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.st{background:#132a62;border-radius:12px;padding:8px 10px;border:2px solid transparent;text-align:right;color:#fff;font:inherit;min-height:0;display:block;width:100%}
.st b{display:block;font-size:16px;direction:ltr;text-align:right;white-space:nowrap}
.st span{font-size:13px;opacity:.85}
.st small{display:block;font-size:12px;opacity:.75;direction:rtl}
.tab{cursor:pointer;position:relative}
.tab::after{content:"‹";position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:22px;opacity:.6}
.tab.on{border-color:#ff4d8d;background:#1b3678}
.tab.on::after{opacity:1;color:#ff4d8d}
main{padding:16px max(4vw,10px) 40px}
button{font:600 15px "Noto Sans Arabic",sans-serif;min-height:44px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.search{font:16px "Noto Sans Arabic",sans-serif;min-height:44px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
.vh{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.vh h2{font-size:19px;margin:0;font-weight:800}
.vh .addi{background:var(--acc);color:#fff;border:0}
.ib{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:10px}
.ib div{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.ib span{font-size:13px;color:var(--mute);display:block}
.ib b{display:block;direction:ltr;text-align:right;white-space:nowrap;font-size:16px}
.ib b.neg{color:var(--acc)}
.ib .am{margin-top:2px;font-size:16px;padding:6px 8px}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:grid;grid-template-columns:34px minmax(0,1fr) 130px 104px;gap:8px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px 10px}
.row.two{grid-template-columns:34px minmax(0,1fr) 250px 104px}
.list.del .row{grid-template-columns:34px minmax(0,1fr) 130px 104px 44px}
.list.del .row.two{grid-template-columns:34px minmax(0,1fr) 250px 104px 44px}
.row.sent{background:var(--okbg);border-color:var(--ok)}
.n{color:var(--mute);font-size:14px;text-align:center}
span.nm{display:block;overflow-wrap:anywhere;line-height:1.4}
.nm{font:600 15px "Noto Sans Arabic",sans-serif;border:0;background:transparent;color:var(--ink);padding:6px 4px;border-radius:8px;width:100%}
input.nm{border:1px dashed var(--line)}
.am{font:700 16px "Noto Sans Arabic",sans-serif;direction:ltr;text-align:right;border:1px solid var(--line);background:transparent;color:var(--ink);padding:8px;border-radius:10px;width:100%}
.nm:focus,.am:focus{outline:2px solid var(--acc)}
.pts{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:6px}
.pt small{display:block;font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pt .am{font-size:15px;padding:7px 6px}
.go{background:var(--band);color:#fff;border:0}
.row.sent .go{background:var(--ok);color:#fff}
.x{width:44px;height:44px;padding:0;display:grid;place-items:center;color:var(--acc);background:transparent;border:1px solid var(--line);border-radius:12px}
.x svg{width:20px;height:20px;pointer-events:none}
.x.sure{width:auto;padding:0 10px;color:#fff;background:var(--acc);border-color:var(--acc);font-size:13px}
.list.del .row:has(.x.sure){grid-template-columns:34px minmax(0,1fr) 130px 104px auto}
.empty{background:var(--panel);border:1px dashed var(--line);border-radius:14px;padding:22px;text-align:center;color:var(--mute)}
.empty button{margin-top:10px;background:var(--acc);color:#fff;border:0}
.chip{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--panel);border:1px solid var(--acc);border-radius:12px;padding:4px 12px 4px 4px;margin-bottom:10px;font-size:14px}
.chip button{min-height:36px}
.mode{background:var(--acc);color:#fff;border-radius:12px;padding:8px 12px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px}
.mode button{min-height:36px;background:#fff;color:var(--acc);border:0}
.ov{position:fixed;inset:0;background:rgba(5,12,30,.55);display:flex;align-items:flex-end;justify-content:center;z-index:9}
.ov[hidden]{display:none}
.sheet{background:var(--bg);width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px;max-height:90vh;overflow:auto}
.sh-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.sh-h b{font-size:18px}
.sheet .opt{width:100%;text-align:right}
.sheet label.opt{display:flex;align-items:center;font:600 15px "Noto Sans Arabic",sans-serif;min-height:44px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel);cursor:pointer}
.sheet label.opt input{position:absolute;opacity:0;width:1px;height:1px}
.sheet label.opt:focus-within{outline:3px solid var(--acc)}
.mode.imp{background:var(--band);flex-wrap:wrap}
.mode.imp button{color:var(--band)}
.mode .bt{display:flex;gap:6px}
.sheet .opt[hidden]{display:none}
.sheet .opt.on{border-color:var(--acc);color:var(--acc)}
.admf{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.admf input{font:16px "Noto Sans Arabic",sans-serif;min-height:44px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);direction:ltr}
.cloud{background:var(--panel);border:1px solid var(--line);color:var(--mute);border-radius:12px;padding:8px 12px;margin-bottom:10px;font-size:13px;display:flex;gap:8px;align-items:center}
body.ro .go,body.ro .am,body.ro #total,body.ro #szb{pointer-events:none}
body.ro #sv,body.ro #add,body.ro #ed,body.ro #dl,body.ro #all,body.ro #undo,body.ro #dmo,body.ro .imp,body.ro .addi,body.ro [data-a=add],body.ro [data-a=start],body.ro #fsn{display:none!important}
.lang{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px;padding-inline:12px 6px}
.seg{display:flex;gap:4px;background:var(--bg);border-radius:10px;padding:3px}
.seg button{min-height:38px;border:0;background:transparent}
.seg button.on{background:var(--band);color:#fff}
.foot{margin-top:14px;display:flex;justify-content:space-between;gap:10px;font-weight:800;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.foot span:last-child{direction:ltr;white-space:nowrap}
.lk{position:fixed;inset:0;z-index:20;background:var(--band);color:#fff;display:flex;align-items:center;justify-content:center;padding:20px}
.lk[hidden]{display:none}
.lkb{width:100%;max-width:340px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.lkl img{width:84px;background:#fff;border-radius:16px;padding:4px}
.lkl svg{width:56px;height:56px}
.lkb b{font-size:20px}
.dots{display:flex;gap:16px;direction:ltr;margin:6px 0}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid #fff}
.dots i.on{background:#fff}
.dots.bad{animation:sh .35s}
@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
#lkm{min-height:22px;margin:0;font-size:14px;color:#ffb3cd}
.kp{display:grid;grid-template-columns:repeat(3,72px);gap:14px;direction:ltr}
.kp button{width:72px;height:72px;border-radius:50%;font:700 26px "Noto Sans Arabic",sans-serif;background:#132a62;color:#fff;border:1px solid #2b4380}
.kp button.k0{grid-column:2}
.kp .kx{background:transparent;border:0;font-size:22px}
.bio{display:flex;align-items:center;gap:8px;background:#fff;color:var(--band);border:0;padding:0 18px;min-height:50px;border-radius:25px}
.bio[hidden]{display:none}
.bio svg{width:26px;height:26px}
#lkc{background:transparent;color:#fff;border:1px solid #2b4380;margin-top:6px}
@media(prefers-reduced-motion:reduce){.dots.bad{animation:none}}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--band);color:#fff;padding:10px 18px;border-radius:12px;opacity:0;pointer-events:none;transition:opacity .25s;white-space:nowrap}
.toast.on{opacity:1}
.note{font-size:13px;color:var(--mute);margin-top:12px}
@media(max-width:600px){
 .row,.row.two,.list.del .row,.list.del .row.two,.list.del .row:has(.x.sure){grid-template-columns:44px minmax(0,1fr) 96px;row-gap:6px}
 .am,.pts{grid-column:2/3;grid-row:2}
 .pt .am{grid-column:auto;grid-row:auto}
 .go{grid-column:3/4;grid-row:1/3;min-height:90px;padding:0 6px;font-size:14px}
 .row.two .go{min-height:104px}
 .x{grid-column:1/2;grid-row:2}
 .x.sure{grid-column:1/4;grid-row:3;width:100%}
 .stats{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
 .ib{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
 .ib div:first-child{grid-column:1/3}
}
@media(prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>
