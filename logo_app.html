<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>دابەشکرنا سلفێ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* VOICE: calm money tool, clear numbers first
   IDEA: a cashier's ledger — total at top, each department ticked off as paid
   PICTURE: the live remaining balance, large, with a fill bar
   COLOUR and TYPE: oxford blue band, white panels, magenta for the remaining; Noto Sans Arabic
   LAYOUT: one column; balance band, then ledger rows */
:root{color-scheme:light dark;--bg:light-dark(#eef1f7,#070f26);--panel:light-dark(#fff,#0f1a3a);--ink:light-dark(#0b1f4b,#e8ecf7);--mute:light-dark(#5a6a8c,#9aa8c9);--line:light-dark(#dde3ef,#1f2c52);--band:#0b1f4b;--acc:#e0115f;--ok:light-dark(#0a7d4f,#3fd59a);--okbg:light-dark(#e3f6ee,#0c2a20)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Noto Sans Arabic",Tahoma,sans-serif;overflow-x:clip}
.band{background:var(--band);color:#fff;padding:22px max(4vw,14px) 26px}
.wrap{max-width:760px;margin:0 auto}
.hd{display:flex;align-items:center;gap:14px;margin-bottom:14px}.logo{width:76px;height:auto;background:#fff;border-radius:14px;padding:4px;flex:none}
h1{font-size:22px;margin:0;font-weight:800;line-height:1.3}
.tot label{display:block;font-size:14px;opacity:.8;margin-bottom:4px}
.tot input{width:100%;font:800 22px "Noto Sans Arabic",sans-serif;padding:10px 14px;border-radius:12px;border:2px solid #2b4380;background:#132a62;color:#fff;direction:ltr;text-align:right}
.tot input:focus{outline:3px solid var(--acc);outline-offset:1px}
.big{margin-top:18px;font-size:14px;opacity:.85}
.rem{font-size:clamp(34px,10vw,52px);font-weight:800;line-height:1.1;color:#ff4d8d;direction:ltr;text-align:right;white-space:nowrap}
.rem.neg{color:#ffb300}
.bar{height:12px;background:#1d3570;border-radius:9px;overflow:hidden;margin:12px 0 14px}
.bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .35s}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.st{background:#132a62;border-radius:12px;padding:8px 10px}
.st b{display:block;font-size:16px;direction:ltr;text-align:right;white-space:nowrap}
.st span{font-size:13px;opacity:.8}
main{padding:16px max(4vw,10px) 40px}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
button{font:600 15px "Noto Sans Arabic",sans-serif;min-height:44px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.search{flex:1 1 180px;font:16px "Noto Sans Arabic",sans-serif;min-height:44px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:grid;grid-template-columns:34px minmax(0,1fr) 130px 104px 44px;gap:8px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px 10px}
.row.sent{background:var(--okbg);border-color:var(--ok)}
.n{color:var(--mute);font-size:14px;text-align:center}
.nm{font:600 15px "Noto Sans Arabic",sans-serif;border:0;background:transparent;color:var(--ink);padding:6px 4px;border-radius:8px;width:100%}
.am{font:700 16px "Noto Sans Arabic",sans-serif;direction:ltr;text-align:right;border:1px solid var(--line);background:transparent;color:var(--ink);padding:8px;border-radius:10px;width:100%}
.nm:focus,.am:focus{outline:2px solid var(--acc)}
.go{background:var(--band);color:#fff;border:0}
.row.sent .go{background:var(--ok);color:#fff}
.x{width:44px;height:44px;padding:0;display:grid;place-items:center;color:var(--acc);background:transparent;border:1px solid var(--line);border-radius:12px}
.x svg{width:20px;height:20px;pointer-events:none}
.x.sure{width:auto;padding:0 10px;color:#fff;background:var(--acc);border-color:var(--acc);font-size:13px}
.row:has(.x.sure){grid-template-columns:34px minmax(0,1fr) 130px 104px auto}
.foot{margin-top:14px;display:flex;justify-content:space-between;font-weight:800;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.foot span:last-child{direction:ltr}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--band);color:#fff;padding:10px 18px;border-radius:12px;opacity:0;pointer-events:none;transition:opacity .25s}
.toast.on{opacity:1}
.note{font-size:13px;color:var(--mute);margin-top:12px}
@media(max-width:560px){
 .row,.row:has(.x.sure){grid-template-columns:44px minmax(0,1fr) 96px;row-gap:6px}
 .am{grid-column:2/3;grid-row:2}
 .go{grid-column:3/4;grid-row:1/3;min-height:90px;padding:0 6px;font-size:14px}
 .x{grid-column:1/2;grid-row:2}
 .x.sure{grid-column:1/4;grid-row:3;width:100%}
 .stats{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
 .st:first-child{grid-column:1/3}
}
@media(prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>

 if(e.target.classList.contains("x")){
  const b=e.target;
  if(!b.classList.contains("sure")){b.classList.add("sure");b.textContent="ژێببە؟ دووبارە بدە";setTimeout(()=>{if(b.isConnected){b.classList.remove("sure");b.innerHTML=TR}},3000);return}
  const r0=S.rows.splice(+row.dataset.i,1)[0];render();toast("«"+r0.name+"» هاتە ژێبرن")}
});
$("list").addEventListener("input",e=>{
 const row=e.target.closest(".row");if(!row)return;const r=S.rows[+row.dataset.i];
 if(e.target.classList.contains("am")){r.amt=p(e.target.value);calc()}
 if(e.target.classList.contains("nm")){r.name=e.target.value;save()}
});
$("list").addEventListener("focusout",e=>{if(e.target.classList.contains("am")){const r=S.rows[+e.target.closest(".row").dataset.i];e.target.value=f(r.amt)}});
$("q").addEventListener("input",e=>{q=e.target.value.trim();render()});
$("add").addEventListener("click",()=>{S.rows.push({id:Date.now(),name:"بەشێ نوو",amt:0,sent:false});edit=true;$("ed").textContent="تەمام";q="";$("q").value="";render();const ins=$("list").querySelectorAll(".nm");const l=ins[ins.length-1];l.focus();l.select()});
$("ed").addEventListener("click",()=>{edit=!edit;$("ed").textContent=edit?"تەمام":"دەستکاری";render()});
$("all").addEventListener("click",()=>{prev=S.rows.map(r=>r.sent);S.rows.forEach(r=>r.sent=true);render();toast("هەمی بەش هاتنە فرێکرن")});
$("undo").addEventListener("click",()=>{if(prev){S.rows.forEach((r,i)=>r.sent=prev[i]??false);prev=null}else S.rows.forEach(r=>r.sent=false);render();toast("هاتە ڤەگەڕاندن")});
$("copy").addEventListener("click",async()=>{
 const sent=S.rows.filter(r=>r.sent);
 const t=["دابەشکرنا سلفێ","کۆی گشتی: "+f(S.total),...sent.map((r,i)=>(i+1)+". "+r.name+": "+f(r.amt)),"هاتیە فرێکرن: "+f(sent.reduce((a,r)=>a+r.amt,0)),"ماوە: "+$("rem").textContent].join("\n");
 try{await navigator.clipboard.writeText(t);toast("هاتە کۆپیکرن")}catch(e){toast("کۆپی نەبوو")}
});
render();
}
</script>
